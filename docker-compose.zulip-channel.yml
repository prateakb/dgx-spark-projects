services:

  # --- Cloudflare Tunnel ---
  # Exposes services to the internet without opening ports or managing TLS.
  # Create a tunnel at: Cloudflare Zero Trust → Networks → Tunnels → Create
  #
  # Add public hostname routes in the dashboard:
  #   zulip.yourdomain.com  →  http://zulip:443
  #   api.yourdomain.com    →  http://claude-code-proxy:8083  (optional)
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - qwen3-coder-nvfp4-net

  # --- Claude Code + Zulip Channel Plugin ---
  # Single container: Claude Code spawns the channel plugin as an MCP subprocess
  # (stdio transport — must be in the same container, not a separate service).
  #
  # Auth: mount your host ~/.claude dir (run `claude auth login` on host first).
  # Or auth interactively: docker exec -it claude-code-zulip claude auth login
  claude-code:
    build:
      context: .
      dockerfile: claude/Dockerfile
      additional_contexts:
        channel: ./channel
    container_name: claude-code-zulip
    restart: unless-stopped
    environment:
      # --- Inference routing (proxy → Qwen on vLLM) ---
      - ANTHROPIC_BASE_URL=http://claude-code-proxy:8083
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-local-spark}
      # --- Permissions ---
      - CLAUDE_PERMISSIONS_MODE=${CLAUDE_PERMISSIONS_MODE:-unattended}
      # --- Zulip (used by channel plugin + permission hook) ---
      - ZULIP_URL=${ZULIP_URL}
      - ZULIP_EMAIL=${ZULIP_BOT_EMAIL}
      - ZULIP_API_KEY=${ZULIP_BOT_API_KEY}
      - ZULIP_STREAM=${ZULIP_STREAM:-claude-code}
      - ZULIP_TOPIC=${ZULIP_TOPIC:-tasks}
      - ALLOWLIST_FILE=/data/allowlist.json
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-60}
    volumes:
      # Auth: mount host credentials (run `claude auth login` on DGX host first)
      - ${CLAUDE_AUTH_DIR:-~/.claude}:/root/.claude
      # Workspace the Claude Code session operates on
      - ./workspace:/workspace
      # Permission relay hook (supervised mode)
      - ./hooks:/hooks:ro
      # Persistent allowlist for sender pairing
      - channel-data:/data
    working_dir: /workspace
    networks:
      - qwen3-coder-nvfp4-net
    stdin_open: true
    tty: true

volumes:
  channel-data:

networks:
  qwen3-coder-nvfp4-net:
    external: true
