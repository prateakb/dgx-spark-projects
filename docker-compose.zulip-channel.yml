services:

  # =============================================
  # ZULIP SERVER (self-hosted)
  # =============================================
  zulip:
    image: zulip/docker-zulip:9.0-0
    container_name: zulip
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - zulip-data:/data
    environment:
      SETTING_EXTERNAL_HOST: ${ZULIP_EXTERNAL_HOST:-localhost}
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMIN_EMAIL:-admin@localhost}
      SECRETS_email_password: ${ZULIP_EMAIL_PASSWORD:-changeme}
      SECRETS_secret_key: ${ZULIP_SECRET_KEY:-changeme-secret}
      SECRETS_postgres_password: ${ZULIP_PG_PASSWORD:-changeme-pg}
      SECRETS_rabbitmq_password: ${ZULIP_RABBIT_PASSWORD:-changeme-rabbit}
      SECRETS_redis_password: ${ZULIP_REDIS_PASSWORD:-changeme-redis}
      # Disable TLS inside container — Cloudflare handles it
      DISABLE_HTTPS: "true"
    depends_on:
      - database
      - cache
      - rabbitmq
    networks:
      - qwen3-coder-nvfp4-net

  database:
    image: postgres:14
    container_name: zulip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${ZULIP_PG_PASSWORD:-changeme-pg}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - qwen3-coder-nvfp4-net

  cache:
    image: redis:7
    container_name: zulip-redis
    restart: unless-stopped
    command: redis-server --requirepass ${ZULIP_REDIS_PASSWORD:-changeme-redis}
    networks:
      - qwen3-coder-nvfp4-net

  rabbitmq:
    image: rabbitmq:3.12
    container_name: zulip-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${ZULIP_RABBIT_PASSWORD:-changeme-rabbit}
    networks:
      - qwen3-coder-nvfp4-net

  # =============================================
  # CLOUDFLARE TUNNEL
  # =============================================
  # Exposes Zulip to the internet without opening router ports.
  # TLS terminates at Cloudflare — traffic inside Docker is plain HTTP.
  #
  # Setup:
  #   1. Cloudflare Zero Trust → Networks → Tunnels → Create
  #   2. Copy the tunnel token to .env as CLOUDFLARE_TUNNEL_TOKEN
  #   3. Add public hostname in the dashboard:
  #        zulip.yourdomain.com → http://zulip:80
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - zulip
    networks:
      - qwen3-coder-nvfp4-net

  # =============================================
  # CLAUDE CODE + ZULIP CHANNEL PLUGIN
  # =============================================
  # Single container: Claude Code spawns the channel plugin as an MCP subprocess.
  #
  # Connect:  docker exec -it claude-code-zulip tmux attach -t claude
  # Detach:   Ctrl+B, D
  # Auth:     docker exec -it claude-code-zulip claude auth login
  claude-code:
    build:
      context: .
      dockerfile: claude/Dockerfile
    container_name: claude-code-zulip
    restart: unless-stopped
    environment:
      # --- Inference routing (proxy → Qwen on vLLM) ---
      - ANTHROPIC_BASE_URL=http://claude-code-proxy:8083
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-local-spark}
      # --- Permissions ---
      - CLAUDE_PERMISSIONS_MODE=${CLAUDE_PERMISSIONS_MODE:-unattended}
      # --- Zulip (used by channel plugin + permission hook) ---
      - ZULIP_URL=http://zulip:80
      - ZULIP_EMAIL=${ZULIP_BOT_EMAIL}
      - ZULIP_API_KEY=${ZULIP_BOT_API_KEY}
      - ZULIP_STREAM=${ZULIP_STREAM:-claude-code}
      - ZULIP_TOPIC=${ZULIP_TOPIC:-tasks}
      - ALLOWLIST_FILE=/data/allowlist.json
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-60}
    volumes:
      - ${CLAUDE_AUTH_DIR:-~/.claude}:/home/claude/.claude
      - ./workspace:/workspace
      - ./hooks:/hooks:ro
      - channel-data:/data
    working_dir: /workspace
    depends_on:
      - zulip
    networks:
      - qwen3-coder-nvfp4-net
    stdin_open: true
    tty: true

volumes:
  zulip-data:
  pg-data:
  channel-data:

networks:
  qwen3-coder-nvfp4-net:
    name: qwen3-coder-nvfp4-net
    driver: bridge
