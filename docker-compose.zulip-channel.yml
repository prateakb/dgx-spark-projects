services:

  # --- Cloudflare Tunnel ---
  # Exposes your existing Zulip to the internet without opening router ports.
  #
  # Setup:
  #   1. Cloudflare Zero Trust → Networks → Tunnels → Create
  #   2. Copy the tunnel token to .env as CLOUDFLARE_TUNNEL_TOKEN
  #   3. Add public hostname in the dashboard:
  #        zulip.yourdomain.com → http://<your-zulip-host>:<port>
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - qwen3-coder-nvfp4-net

  # --- Claude Code + Zulip Channel Plugin ---
  # Single container: Claude Code spawns the channel plugin as an MCP subprocess.
  #
  # Connect:  docker exec -it claude-code-zulip tmux -S /tmp/claude-tmux attach -t claude
  # Detach:   Ctrl+B, D
  claude-code:
    build:
      context: .
      dockerfile: claude/Dockerfile
    container_name: claude-code-zulip
    restart: unless-stopped
    environment:
      # --- Inference routing (proxy → Qwen on vLLM) ---
      - ANTHROPIC_BASE_URL=http://claude-code-proxy:8083
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-local-spark}
      # --- Permissions ---
      - CLAUDE_PERMISSIONS_MODE=${CLAUDE_PERMISSIONS_MODE:-unattended}
      # --- Zulip (channel plugin + permission hook) ---
      - ZULIP_URL=${ZULIP_URL}
      - ZULIP_EMAIL=${ZULIP_BOT_EMAIL}
      - ZULIP_API_KEY=${ZULIP_BOT_API_KEY}
      - ZULIP_STREAM=${ZULIP_STREAM:-claude-code}
      - ZULIP_TOPIC=${ZULIP_TOPIC:-tasks}
      - ALLOWLIST_FILE=/data/allowlist.json
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-60}
    volumes:
      - ./workspace:/workspace
      - ./hooks:/hooks:ro
      - channel-data:/data
      # Persist OAuth credentials across container restarts
      - claude-auth:/home/claude/.claude
    working_dir: /workspace
    networks:
      - qwen3-coder-nvfp4-net
    stdin_open: true
    tty: true

volumes:
  channel-data:
  claude-auth:

networks:
  qwen3-coder-nvfp4-net:
    name: qwen3-coder-nvfp4-net
    driver: bridge
