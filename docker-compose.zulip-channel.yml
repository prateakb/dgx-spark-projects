services:

  # --- Cloudflare Tunnel ---
  # Exposes the self-hosted Zulip instance to the internet via Cloudflare Tunnel.
  # Create a tunnel in the Cloudflare Zero Trust dashboard, then set
  # CLOUDFLARE_TUNNEL_TOKEN in .env to the token shown on the install page.
  #
  # In the dashboard, add a public hostname route:
  #   zulip.yourdomain.com  →  http://zulip:443  (or https://zulip:443 if Zulip has TLS)
  #
  # If you also want to expose the proxy API externally:
  #   api.yourdomain.com    →  http://claude-code-proxy:8083
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - qwen3-coder-nvfp4-net

  # --- Zulip MCP Channel Plugin ---
  zulip-channel:
    build: ./channel
    container_name: zulip-channel
    restart: unless-stopped
    environment:
      ZULIP_URL: ${ZULIP_URL}
      ZULIP_EMAIL: ${ZULIP_BOT_EMAIL}
      ZULIP_API_KEY: ${ZULIP_BOT_API_KEY}
      ZULIP_STREAM: ${ZULIP_STREAM:-claude-code}
      ZULIP_TOPIC: ${ZULIP_TOPIC:-tasks}
      ALLOWLIST_FILE: /data/allowlist.json
    volumes:
      - channel-data:/data

  # --- Claude Code Session ---
  claude-code:
    build: ./claude
    container_name: claude-code-zulip
    restart: unless-stopped
    environment:
      - ANTHROPIC_BASE_URL=http://claude-code-proxy:8083
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-local-spark}
      - CLAUDE_PERMISSIONS_MODE=${CLAUDE_PERMISSIONS_MODE:-unattended}
      # Zulip credentials for the permission relay hook (supervised mode)
      - ZULIP_URL=${ZULIP_URL}
      - ZULIP_EMAIL=${ZULIP_BOT_EMAIL}
      - ZULIP_API_KEY=${ZULIP_BOT_API_KEY}
      - ZULIP_STREAM=${ZULIP_STREAM:-claude-code}
      - ZULIP_TOPIC=${ZULIP_TOPIC:-tasks}
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-60}
    volumes:
      - ./workspace:/workspace
      - ./hooks:/hooks:ro
      - channel-data:/root/.claude/channels/zulip
    working_dir: /workspace
    networks:
      - qwen3-coder-nvfp4-net
    depends_on:
      - zulip-channel
    stdin_open: true
    tty: true

volumes:
  channel-data:

networks:
  qwen3-coder-nvfp4-net:
    external: true
